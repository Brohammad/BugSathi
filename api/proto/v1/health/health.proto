syntax = "proto3";

package health.v1;

option go_package = "github.com/Brohammad/BugSathi/api/gen/health/v1;healthv1";

// Versioned health contract (ADR-0006). Codegen lands when we add a gRPC server;
// the HTTP /healthz|/readyz endpoints are the M2 surface.

service HealthService {
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
}

message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  enum ServingStatus {
    SERVING_STATUS_UNSPECIFIED = 0;
    SERVING_STATUS_SERVING = 1;
    SERVING_STATUS_NOT_SERVING = 2;
  }
  ServingStatus status = 1;
}
