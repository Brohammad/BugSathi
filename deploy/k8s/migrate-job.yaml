apiVersion: batch/v1
kind: Job
metadata:
  name: bugsathi-migrate
  namespace: bugsathi
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: bugsathi/migrate:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: bugsathi-config
            - secretRef:
                name: bugsathi-secrets
