global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: bugsathi-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          service: api

  - job_name: bugsathi-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels:
          service: worker
